<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Find - Mobile Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: white;
        }
        .header-ui { 
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(0,0,0,0.7); height: 40px; width: 100%;
            border-bottom: 2px solid #0f0; color: #0f0; font-size: 20px; font-weight: bold;
        }
        .val-text { color: #fff; margin-left: 5px; }
        #msg { 
            position: absolute; top: 55%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 26px; text-align: center; color: #0f0;
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px;
            white-space: pre-wrap; z-index: 10; border: 2px solid #fff;
            line-height: 1.4; width: 70%;
        }
    </style>
</head>
<body>

    <video id="input_video" style="display:none" playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="ui-layer">
        <div class="header-ui">
            <div>SCORE: <span id="score" class="val-text">0</span></div>
            <div>TIME: <span id="timer" class="val-text">60</span></div>
        </div>
        <div id="msg">カメラを起動中...</div>
    </div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const scoreElement = document.getElementById('score');
const timerElement = document.getElementById('timer');
const msgElement = document.getElementById('msg');

// 8列3段設定
const COLS = 8;
const ROWS = 3;
const UI_MARGIN_TOP = 42; // ヘッダーの高さに合わせる
const emojiPool = ['😉','😊','😋','☺️','🙂','🤨','😐','😑','🙄','😌','😔','😞'];

let score = 0;
let gameStarted = false;
let startTime = 0;
const gameDuration = 60; 
let countdown = gameDuration;

let fpo1x = 0.5, fpo1y = 0.5; 
let hiritu = 1.0;
let circles = [];
let cursorRadius = 35;
let lastTargetEmoji = ""; // 連続防止用

let canScore = true;
let hasClosedMouth = true;
let isCoolDown = false;
let hitEffectTimer = 0;

const speech = window.speechSynthesis;
function speak(text) {
    if (speech.speaking) speech.cancel();
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'ja-JP';
    speech.speak(uttr);
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq = 1000) {
    try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
}

function nextProblem() {
    circles = [];
    const width = window.innerWidth;
    const height = window.innerHeight - UI_MARGIN_TOP;
    
    const stepX = width / (COLS + 1);
    // 配置エリアを計算し、全体を上へ寄せる
    const stepY = height / (ROWS + 1); 
    const firstRowOffset = stepY * 0.5; // 1段目の余白を従来の半分にする

    const dynamicEmojiSize = Math.min(stepX, stepY) * 0.85;
    cursorRadius = dynamicEmojiSize * 0.7;

    // 同じ正解が連続しないように選択
    let availableTargets = emojiPool.filter(e => e !== lastTargetEmoji);
    let targetEmoji = availableTargets[Math.floor(Math.random() * availableTargets.length)];
    lastTargetEmoji = targetEmoji;

    let otherEmojis = emojiPool.filter(e => e !== targetEmoji);
    let baseEmoji = otherEmojis[Math.floor(Math.random() * otherEmojis.length)];

    const targetIndex = Math.floor(Math.random() * (COLS * ROWS));

    let count = 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const isTarget = (count === targetIndex);
            circles.push({
                x: width - (stepX * (c + 1)),
                y: UI_MARGIN_TOP + (stepY * r) + firstRowOffset,
                emoji: isTarget ? targetEmoji : baseEmoji,
                isTarget: isTarget,
                size: dynamicEmojiSize
            });
            count++;
        }
    }
}

function onResults(results) {
    if (canvasElement.width !== window.innerWidth || canvasElement.height !== window.innerHeight) {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
        if (gameStarted) nextProblem();
    }
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        hiritu = (landmarks[152].y - landmarks[10].y) / 0.35;
        
        const rawX = 0.5 - (fpo1x - landmarks[1].x) * 5; //3.5から変更-----------------------
        const relativeY = 0.4 - (fpo1y - landmarks[1].y) * 7; //5.5から変更-------------------
        const cursorX = rawX * w;
        const cursorY = relativeY * h;

        const mouthOpenHeight = (landmarks[14].y - landmarks[13].y);
        const threshold = (0.015 - (Math.max(0, Math.min(1, relativeY)) * 0.008)) * hiritu;
        const mouthOpen = mouthOpenHeight > threshold;

        if (gameStarted) {
            msgElement.style.display = "none";
            let hoveringTarget = false;
            
            circles.forEach(c => {
                const dist = Math.sqrt((cursorX - c.x)**2 + (cursorY - c.y)**2);
                const isHover = dist < (c.size * 0.6);

                canvasCtx.save();
                canvasCtx.translate(c.x, c.y);
                canvasCtx.scale(-1, 1);
                canvasCtx.font = `${c.size}px serif`;
                canvasCtx.textAlign = "center";
                canvasCtx.textBaseline = "middle";
                canvasCtx.fillText(c.emoji, 0, 0);
                canvasCtx.restore();

                if (isHover && c.isTarget) {
                    hoveringTarget = true;
                    if (mouthOpen && canScore) {
                        score++;
                        scoreElement.innerText = score;
                        beep(1200);
                        hitEffectTimer = 5;
                        canScore = false;
                        nextProblem(); 
                    }
                } else if (isHover && !c.isTarget && mouthOpen && canScore) {
                    beep(400);
                    canScore = false;
                }
            });

            canvasCtx.beginPath();
            canvasCtx.arc(cursorX, cursorY, cursorRadius, 0, 2 * Math.PI);
            canvasCtx.lineWidth = 6;
            canvasCtx.strokeStyle = (hoveringTarget && mouthOpen) ? "#FF69B4" : "#00FF00";
            canvasCtx.stroke();

            if (hitEffectTimer > 0) {
                canvasCtx.beginPath();
                canvasCtx.arc(cursorX, cursorY, cursorRadius + (15 - hitEffectTimer * 3), 0, 2 * Math.PI);
                canvasCtx.strokeStyle = "white";
                canvasCtx.lineWidth = 3;
                canvasCtx.stroke();
                hitEffectTimer--;
            }

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            countdown = Math.max(0, gameDuration - elapsed);
            timerElement.innerText = countdown;
            if (countdown <= 0) {
                gameStarted = false;
                hasClosedMouth = false;
                isCoolDown = true;
                speak(score + "点です。終了");
                setTimeout(() => { isCoolDown = false; }, 3000);
            }
        } else {
            canvasCtx.beginPath();
            canvasCtx.arc(cursorX, cursorY, cursorRadius, 0, 2 * Math.PI);
            canvasCtx.lineWidth = 6;
            canvasCtx.strokeStyle = "#00FF00";
            canvasCtx.stroke();

            msgElement.style.display = "block";
            if (isCoolDown) {
                msgElement.innerText = "終了！ スコア: " + score;
            } else if (!hasClosedMouth) {
                msgElement.innerText = "一度口を閉じてください";
            } else {
                msgElement.innerText = "口を開けてスタート！";
                if (mouthOpen) {
                    fpo1x = landmarks[1].x;
                    fpo1y = landmarks[1].y;
                    gameStarted = true;
                    startTime = Date.now();
                    score = 0;
                    scoreElement.innerText = score;
                    canScore = false; 
                    nextProblem();
                    speak("スタート");
                }
            }
        }

        if (!mouthOpen) {
            canScore = true;
            hasClosedMouth = true;
        }
    }
    canvasCtx.restore();
}

const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
    maxNumFaces: 1, refineLandmarks: false,
    minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
});
faceMesh.onResults(onResults);

const camera = new Camera(videoElement, {
    onFrame: async () => { await faceMesh.send({image: videoElement}); },
    width: 640, height: 480
});
camera.start();

window.addEventListener('resize', () => {
    nextProblem();
});
</script>
</body>
</html>
